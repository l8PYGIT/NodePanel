<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pBannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="pBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="pGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="940" height="260" rx="16" fill="url(#pBannerBg)" />
  <rect width="940" height="260" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glow Behind Logo -->
  <circle cx="160" cy="130" r="100" fill="url(#pGlowGrad)" filter="url(#pGlow)" />
  <circle cx="820" cy="80" r="120" fill="url(#pGlowGrad)" filter="url(#pGlow)" />

  <!-- Grid decoration lines -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="60" x2="900" y2="60" />
    <line x1="40" y1="130" x2="900" y2="130" />
    <line x1="40" y1="200" x2="900" y2="200" />
  </g>

  <!-- NodePanel Logo Symbol (Hex Shield with Connected Nodes) -->
  <g transform="translate(80, 50)">
    <!-- Outer Hex Shield -->
    <polygon points="80,10 145,45 145,115 80,150 15,115 15,45" fill="#131b2e" stroke="url(#pBrandGrad)" stroke-width="3.5" />
    
    <!-- Central Node Core -->
    <circle cx="80" cy="80" r="18" fill="url(#pBrandGrad)" />
    
    <!-- Satellite Nodes -->
    <circle cx="45" cy="55" r="7" fill="#38bdf8" />
    <circle cx="115" cy="55" r="7" fill="#a855f7" />
    <circle cx="45" cy="105" r="7" fill="#22c55e" />
    <circle cx="115" cy="105" r="7" fill="#f59e0b" />

    <!-- Connecting Edges -->
    <line x1="80" y1="80" x2="45" y2="55" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="80" y1="80" x2="115" y2="55" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
    <line x1="80" y1="80" x2="45" y2="105" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
    <line x1="80" y1="80" x2="115" y2="105" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography & Content -->
  <g transform="translate(280, 55)">
    <!-- Brand Title -->
    <text x="0" y="42" fill="#ffffff" font-size="38" font-weight="800" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="-0.5">
      Node<tspan fill="url(#pBrandGrad)">Panel</tspan>
    </text>
    
    <!-- Badges Row -->
    <g transform="translate(225, 14)">
      <rect x="0" y="0" width="84" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="42" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">v0.8.0 RELEASE</text>

      <rect x="94" y="0" width="102" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="145" y="16" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">DEDICATED CORE</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="80" fill="#cbd5e1" font-size="15" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
      Fleet Control Plane for Multi-Tenant &amp; Dedicated Node Access Sales
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="128" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="18" fill="#94a3b8" font-size="11.5" font-weight="500" font-family="system-ui, sans-serif">Fleet Management</text>

      <rect x="138" y="0" width="134" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <circle cx="152" cy="14" r="4" fill="#8b5cf6" />
      <text x="164" y="18" fill="#94a3b8" font-size="11.5" font-weight="500" font-family="system-ui, sans-serif">Inbound Permissions</text>

      <rect x="282" y="0" width="126" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <circle cx="296" cy="14" r="4" fill="#22c55e" />
      <text x="308" y="18" fill="#94a3b8" font-size="11.5" font-weight="500" font-family="system-ui, sans-serif">User Slots Cap</text>

      <rect x="418" y="0" width="144" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <circle cx="432" cy="14" r="4" fill="#f59e0b" />
      <text x="444" y="18" fill="#94a3b8" font-size="11.5" font-weight="500" font-family="system-ui, sans-serif">Capacity Webhooks</text>
    </g>
  </g>
</svg>
