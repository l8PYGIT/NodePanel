<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#172033" />
    </linearGradient>
    <linearGradient id="sharedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="dedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="940" height="540" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Subtitle -->
  <text x="470" y="44" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Node Architecture: Shared Core vs. Dedicated Instances</text>
  <text x="470" y="70" fill="#94a3b8" font-size="13.5" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Dynamic SNI Routing (Port 443) + Multi-Tenant Core + Isolated Dedicated Instances</text>

  <!-- Left: Traffic Ingress -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="180" height="380" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="55" y="125" width="150" height="28" rx="6" fill="#334155" />
    <text x="130" y="144" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">CLIENT INGRESS</text>

    <!-- Client Requests -->
    <rect x="55" y="175" width="150" height="60" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="130" y="198" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Shared Clients</text>
    <text x="130" y="216" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="monospace">SNI: shared.node.com</text>

    <rect x="55" y="270" width="150" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="130" y="293" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Dedicated Buyer 1</text>
    <text x="130" y="311" fill="#c084fc" font-size="11" text-anchor="middle" font-family="monospace">SNI: vpn.client-a.com</text>

    <rect x="55" y="365" width="150" height="60" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
    <text x="130" y="388" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Dedicated Buyer 2</text>
    <text x="130" y="406" fill="#c084fc" font-size="11" text-anchor="middle" font-family="monospace">SNI: sub.client-b.ir</text>

    <text x="130" y="465" fill="#64748b" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Port 443 TLS Handshake</text>
  </g>

  <!-- Middle: Port 443 SNI Router -->
  <g filter="url(#shadow)">
    <rect x="260" y="110" width="190" height="380" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="275" y="125" width="160" height="28" rx="6" fill="#1d4ed8" />
    <text x="355" y="144" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">PORT 443 SNI ROUTER</text>

    <text x="355" y="185" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Inspects ClientHello SNI</text>

    <!-- Dispatch Logic -->
    <path d="M 355 200 L 355 450" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5" />

    <rect x="275" y="215" width="160" height="42" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <text x="355" y="233" fill="#38bdf8" font-size="11.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Matched Default / Shared</text>
    <text x="355" y="247" fill="#64748b" font-size="10" text-anchor="middle" font-family="monospace">Forward to Port 443 Main</text>

    <rect x="275" y="295" width="160" height="42" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
    <text x="355" y="313" fill="#c084fc" font-size="11.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Matched Domain A</text>
    <text x="355" y="327" fill="#64748b" font-size="10" text-anchor="middle" font-family="monospace">Route to 127.0.0.1:11001</text>

    <rect x="275" y="375" width="160" height="42" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
    <text x="355" y="393" fill="#c084fc" font-size="11.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Matched Domain B</text>
    <text x="355" y="407" fill="#64748b" font-size="10" text-anchor="middle" font-family="monospace">Route to 127.0.0.1:11002</text>
  </g>

  <!-- Arrows from Ingress to SNI Router -->
  <path d="M 205 205 L 260 236" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowBlue)" />
  <path d="M 205 300 L 260 316" stroke="#8b5cf6" stroke-width="2" />
  <path d="M 205 395 L 260 396" stroke="#a855f7" stroke-width="2" />

  <!-- Right: Xray Backend Execution -->
  <g filter="url(#shadow)">
    <rect x="490" y="110" width="410" height="380" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Shared Core Section -->
    <rect x="510" y="130" width="370" height="135" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" />
    <rect x="525" y="142" width="115" height="22" rx="4" fill="url(#sharedGrad)" />
    <text x="582" y="157" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">SHARED XRAY CORE</text>
    <text x="760" y="157" fill="#38bdf8" font-size="11.5" font-family="monospace">Internal Port: 443 / 62050</text>
    <text x="525" y="186" fill="#e2e8f0" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Multi-Tenant User Table Injection</text>
    <text x="525" y="204" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Inbound pinning: Only allowed tags (vless-in, vmess-in)</text>
    <text x="525" y="222" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Hard User Cap: Enforces max_users (HTTP 400 / gRPC ResourceExhausted)</text>
    <text x="525" y="240" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Local quota &amp; expiry enforcement in bbolt store</text>

    <!-- Dedicated Core Section -->
    <rect x="510" y="280" width="370" height="190" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
    <rect x="525" y="292" width="135" height="22" rx="4" fill="url(#dedGrad)" />
    <text x="592" y="307" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">DEDICATED INSTANCES</text>
    <text x="765" y="307" fill="#c084fc" font-size="11.5" font-family="monospace">Dynamic Ports: 11000+</text>
    
    <rect x="525" y="326" width="340" height="58" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="537" y="346" fill="#f8fafc" font-size="11.5" font-weight="600" font-family="system-ui, sans-serif">Dedicated Instance 1 (Port 11001)</text>
    <text x="537" y="364" fill="#94a3b8" font-size="10.5" font-family="system-ui, sans-serif">Isolated Xray process • Custom config push via PasarGuard panel</text>
    <text x="537" y="378" fill="#a855f7" font-size="10" font-family="monospace">Domain: vpn.client-a.com</text>

    <rect x="525" y="394" width="340" height="58" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="537" y="414" fill="#f8fafc" font-size="11.5" font-weight="600" font-family="system-ui, sans-serif">Dedicated Instance 2 (Port 11002)</text>
    <text x="537" y="432" fill="#94a3b8" font-size="10.5" font-family="system-ui, sans-serif">Isolated Xray process • Independent outbounds &amp; routing rules</text>
    <text x="537" y="446" fill="#a855f7" font-size="10" font-family="monospace">Domain: sub.client-b.ir</text>
  </g>

  <!-- Connectors from SNI router to Backends -->
  <path d="M 435 236 L 510 195" stroke="#0ea5e9" stroke-width="2" />
  <path d="M 435 316 L 510 355" stroke="#8b5cf6" stroke-width="2" />
  <path d="M 435 396 L 510 425" stroke="#a855f7" stroke-width="2" />

  <!-- Footer badge -->
  <text x="470" y="515" fill="#64748b" font-size="11.5" text-anchor="middle" font-family="system-ui, sans-serif">PasarGuard Node Engine • Zero Interference Between Dedicated &amp; Shared Tenants</text>
</svg>
