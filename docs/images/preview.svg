<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <defs>
    <linearGradient id="pViewBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pVCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#182234" />
    </linearGradient>
    <linearGradient id="pProgress" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="pVS" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Browser Frame Window -->
  <rect width="940" height="560" rx="14" fill="url(#pViewBg)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Browser Header Bar -->
  <rect width="940" height="42" rx="14" fill="#131d2e" />
  <rect y="32" width="940" height="10" fill="#131d2e" />
  <line x1="0" y1="42" x2="940" y2="42" stroke="#1e293b" stroke-width="1.2" />

  <!-- Window controls -->
  <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5.5" fill="#22c55e" />

  <!-- Address Bar -->
  <rect x="250" y="8" width="440" height="26" rx="6" fill="#0b1120" stroke="#1e293b" />
  <text x="470" y="25" fill="#94a3b8" font-size="11.5" text-anchor="middle" font-family="monospace">https://panel.internal:8080/#dashboard</text>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="42" width="940" height="52" fill="#0f172a" />
  <line x1="0" y1="94" x2="940" y2="94" stroke="#1e293b" stroke-width="1.2" />

  <!-- Brand in Topbar -->
  <circle cx="36" cy="68" r="14" fill="#4f46e5" />
  <text x="36" y="73" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle" font-family="system-ui">PG</text>
  <text x="60" y="73" fill="#f8fafc" font-size="15" font-weight="700" font-family="system-ui">PasarGuard Panel</text>

  <!-- Active View Indicator -->
  <text x="210" y="73" fill="#818cf8" font-size="13.5" font-weight="600" font-family="system-ui">داشبورد و وضعیت مشترکین</text>

  <!-- Right side: Theme dots & Token button -->
  <circle cx="800" cy="68" r="6" fill="#4f46e5" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="818" cy="68" r="6" fill="#6366f1" />
  <circle cx="836" cy="68" r="6" fill="#38bdf8" />
  <circle cx="854" cy="68" r="6" fill="#0d9488" />

  <rect x="874" y="55" width="48" height="26" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="898" y="72" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui">توکن</text>

  <!-- 4 KPI Stat Cards -->
  <g transform="translate(30, 110)" filter="url(#pVS)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="205" height="80" rx="10" fill="url(#pVCard)" stroke="#334155" stroke-width="1" />
    <text x="18" y="26" fill="#94a3b8" font-size="12" font-family="system-ui">نودهای متصل</text>
    <text x="18" y="58" fill="#f8fafc" font-size="24" font-weight="800" font-family="system-ui">1</text>
    <rect x="115" y="40" width="75" height="22" rx="11" fill="rgba(34,197,94,0.15)" />
    <text x="152" y="55" fill="#22c55e" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui">۱ آنلاین</text>

    <!-- Card 2 -->
    <rect x="225" y="0" width="205" height="80" rx="10" fill="url(#pVCard)" stroke="#334155" stroke-width="1" />
    <text x="243" y="26" fill="#94a3b8" font-size="12" font-family="system-ui">مشتریان فعال</text>
    <text x="243" y="58" fill="#f8fafc" font-size="24" font-weight="800" font-family="system-ui">1</text>
    <rect x="340" y="40" width="75" height="22" rx="11" fill="rgba(56,189,248,0.15)" />
    <text x="377" y="55" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui">سازمانی</text>

    <!-- Card 3 -->
    <rect x="450" y="0" width="205" height="80" rx="10" fill="url(#pVCard)" stroke="#334155" stroke-width="1" />
    <text x="468" y="26" fill="#94a3b8" font-size="12" font-family="system-ui">اشتراک‌های فعال</text>
    <text x="468" y="58" fill="#f8fafc" font-size="24" font-weight="800" font-family="system-ui">1</text>
    <rect x="565" y="40" width="75" height="22" rx="11" fill="rgba(139,92,246,0.15)" />
    <text x="602" y="55" fill="#a855f7" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui">هسته اختصاصی</text>

    <!-- Card 4 -->
    <rect x="675" y="0" width="205" height="80" rx="10" fill="url(#pVCard)" stroke="#334155" stroke-width="1" />
    <text x="693" y="26" fill="#94a3b8" font-size="12" font-family="system-ui">مصرف کل تجمعی</text>
    <text x="693" y="58" fill="#f8fafc" font-size="24" font-weight="800" font-family="system-ui">0 B</text>
    <text x="860" y="55" fill="#64748b" font-size="11.5" text-anchor="end" font-family="system-ui">از ۵۰۰ GB</text>
  </g>

  <!-- Main Subscriptions Table Card -->
  <g transform="translate(30, 210)" filter="url(#pVS)">
    <rect x="0" y="0" width="880" height="320" rx="12" fill="url(#pVCard)" stroke="#334155" stroke-width="1" />
    
    <!-- Table Header Toolbar -->
    <text x="24" y="34" fill="#f8fafc" font-size="15" font-weight="700" font-family="system-ui">اشتراک‌ها (مدیریت دسترسی و ظرفیت خریداران)</text>
    
    <rect x="740" y="16" width="120" height="28" rx="6" fill="#4f46e5" />
    <text x="800" y="35" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui">+ اشتراک جدید</text>

    <!-- Table Columns Header -->
    <rect x="16" y="56" width="848" height="34" rx="6" fill="#0f172a" />
    <text x="36" y="78" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui">مشتری</text>
    <text x="180" y="78" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui">نود سرور</text>
    <text x="290" y="78" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui">پلن</text>
    <text x="420" y="78" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui">نوع هسته</text>
    <text x="510" y="78" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui">ظرفیت کاربران</text>
    <text x="630" y="78" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui">مصرف حجم</text>
    <text x="760" y="78" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui">عملیات</text>

    <!-- Table Row 1 (Dedicated Core Tenant) -->
    <g transform="translate(16, 98)">
      <rect x="0" y="0" width="848" height="52" rx="4" fill="#131d2e" stroke="#1e293b" />
      <text x="20" y="31" fill="#f8fafc" font-size="13" font-weight="600" font-family="system-ui">Pars-Telecom</text>
      
      <text x="164" y="31" fill="#cbd5e1" font-size="12.5" font-family="system-ui">Local-Node-01</text>
      
      <text x="274" y="31" fill="#cbd5e1" font-size="12.5" font-family="system-ui">Dedicated-500GB</text>

      <!-- Core badge -->
      <rect x="404" y="16" width="68" height="20" rx="10" fill="#8b5cf6" />
      <text x="438" y="30" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui">اختصاصی</text>

      <!-- Users slot count -->
      <text x="494" y="31" fill="#38bdf8" font-size="12.5" font-weight="600" font-family="system-ui">0 / 50 کاربر</text>

      <!-- Quota progress bar -->
      <rect x="614" y="21" width="90" height="8" rx="4" fill="#0b1120" />
      <rect x="614" y="21" width="10" height="8" rx="4" fill="url(#pProgress)" />
      <text x="614" y="15" fill="#94a3b8" font-size="10" font-family="system-ui">0 / 500.0 GB</text>

      <!-- Action buttons -->
      <rect x="744" y="14" width="70" height="24" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="779" y="30" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="system-ui">اتصال مشتری</text>
    </g>

    <!-- Table Row 2 (Shared Core Tenant) -->
    <g transform="translate(16, 158)">
      <rect x="0" y="0" width="848" height="52" rx="4" fill="#0f172a" stroke="#1e293b" />
      <text x="20" y="31" fill="#f8fafc" font-size="13" font-weight="600" font-family="system-ui">Arya-Net-Shop</text>
      
      <text x="164" y="31" fill="#cbd5e1" font-size="12.5" font-family="system-ui">Germany-Edge-02</text>
      
      <text x="274" y="31" fill="#cbd5e1" font-size="12.5" font-family="system-ui">Shared-VLESS-100GB</text>

      <!-- Core badge -->
      <rect x="404" y="16" width="68" height="20" rx="10" fill="#334155" />
      <text x="438" y="30" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui">اشتراکی</text>

      <!-- Users slot count -->
      <text x="494" y="31" fill="#22c55e" font-size="12.5" font-weight="600" font-family="system-ui">14 / 20 کاربر</text>

      <!-- Quota progress bar -->
      <rect x="614" y="21" width="90" height="8" rx="4" fill="#0b1120" />
      <rect x="614" y="21" width="60" height="8" rx="4" fill="url(#pProgress)" />
      <text x="614" y="15" fill="#94a3b8" font-size="10" font-family="system-ui">64.2 / 100.0 GB</text>

      <!-- Action buttons -->
      <rect x="744" y="14" width="70" height="24" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="779" y="30" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="system-ui">اتصال مشتری</text>
    </g>

    <!-- Bottom Notice -->
    <text x="440" y="295" fill="#64748b" font-size="11.5" text-anchor="middle" font-family="system-ui">
      پشتیبانی بومی از مسیریابی SNI، فیلتر اینباندهای مجاز، سقف ظرفیت پرسنل و هشدارهای وب‌هوک
    </text>
  </g>
</svg>
